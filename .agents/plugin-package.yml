schema_version: 1
identity:
  name: ai4comms
  display_name: AI4comms
  version: 0.4.39
  description: Plugin for AI4comms branded deliverables
  author:
    name: stromy-org
  repository: https://github.com/stromy-org/ai4comms-plugin
  license: UNLICENSED
  keywords:
  - deliverables
  - branding
  - documents
  - messaging
  - press-release
  - social
  - public-affairs
  - dutch-government
targets:
- openai
- codex
- claude
- cursor
- copilot
- vscode
- kiro
- gemini
portable_capabilities:
  branded-deliverables:
    summary: Branded documents, decks, charts, diagrams and video rendered server-side in the client's
      brand
    skills:
    - format-chart
    - format-diagram
    - format-docx
    - format-docx-hd
    - format-guide
    - format-html-hd
    - format-html-reveal
    - format-i18n
    - format-mermaid
    - format-motion
    - format-pdf
    - format-pdf-hd
    - format-pptx
    - format-pptx-hd
    - format-prepare-document
    - format-video-hd
    - format-xlsx
    mcp_servers:
    - stromy-format
  plugin-workflows:
    summary: Workflows authored for this plugin and shipped inside it
    skills:
    - getting-started
    - messaging-framework
    - organic-social-campaign
    - press-release
    - proposal
  dutch-government-research:
    summary: Dutch government, parliament and legislation research
    skills:
    - nl-accountability
    - nl-dossier-tracker
    - nl-eu-transposition
    - nl-evidence-grounding
    - nl-gov-data
    - nl-guide
    - nl-horizon-scan
    - nl-issue-framing
    - nl-monitor
    - nl-parliamentary-positioning
    - nl-policy-legislative-landscape
    - nl-tensions
    mcp_servers:
    - nl-gov-data
